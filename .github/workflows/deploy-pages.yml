name: Deploy typography site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check static site files
        run: |
          test -s dist/index.html
          test -s dist/fonts.json
          node --check dist/app.js
          node --check dist/icons.js
          node --check dist/navigation.js
          node --check dist/vocabulary.js
          test -s dist/vocabulary.html
          node -e "const data = require('./dist/fonts.json'); if (!Array.isArray(data.fonts) || !data.fonts.length) process.exit(1)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
